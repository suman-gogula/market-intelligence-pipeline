# Runs the tests and the demo on every push and pull request.
# Needs no secrets and no database service. Free for public repositories.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install -e . --no-deps
      - run: python -m compileall -q src tests scripts
      - run: python -m unittest discover -s tests -t . -v
      - run: python -m market_intel demo --reset
